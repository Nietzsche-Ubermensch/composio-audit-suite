[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "composio-audit-suite"
version = "1.0.0"
description = "Composio toolkit audit suite — dependency graphs, tool schemas, response schemas, and plan generation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
composio-audit = "audit.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
